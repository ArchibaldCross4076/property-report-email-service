[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "property-report-email-service"
version = "0.1.0"
description = "Generate a property operations PDF and email it to a manager."
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
property-report-service = "property_report_mailer.service:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

